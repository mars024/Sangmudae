<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>행렬 좌회전 시뮬레이터</title>
<style>
:root {
  --color-bg: #0f172a;       /* 1. 메인 어두운 배경색 */
  --color-surface: #334155;  /* 2. 표면, 비활성 버튼, 화살표 기본색 */
  --color-text: #f8fafc;     /* 3. 일반 텍스트, 하이라이트 윤곽선 */
  --color-accent: #38bdf8;   /* 4. 핵심 강조색 (스카이 블루) - 발 기본색, 모드 활성색 */
  --color-new: #f59e0b;      /* 5. 대비형 활성색 (오렌지/앰버) - 재생 버튼 기본색, 발 하이라이트 */
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-container {
  flex: 1;
  height: 100%;
  padding: 10px;
  overflow: hidden;
}

.simulation-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: var(--color-bg);
  border-radius: 16px;
  border: 1px solid var(--color-surface);
  overflow: hidden;
}

.mode-overlay {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  padding: 6px 8px;
  border-radius: 10px;
  border: 1px solid var(--color-surface);
  align-items: center;
}

.mode-title {
  font-size: 11px;
  font-weight: bold;
  color: var(--color-text);
  white-space: nowrap;
  margin-bottom: 2px;
  opacity: 0.8;
}

.mode-buttons-group {
  display: flex;
  gap: 6px;
}

.square-mode-btn {
  width: 36px;
  height: 36px;
  background: transparent;
  border: none;
  color: var(--color-surface);
  font-size: 15px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.square-mode-btn.active {
  background-color: var(--color-accent);
  color: var(--color-bg);
}

#sim-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.controls-overlay {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  padding: 8px 16px;
  border-radius: 16px;
  border: 1px solid var(--color-surface);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}

.step-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.btn-square {
  width: 44px;
  height: 44px;
  padding: 0;
  background-color: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-surface);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.btn-square:active {
  transform: scale(0.92);
}

.btn-square.btn-primary {
  background-color: var(--color-accent);
  color: var(--color-bg);
  border: none;
}

.btn-square.btn-play {
  background-color: var(--color-new);
  color: var(--color-bg);
  border: none;
}

.btn-square.btn-play.playing {
  background-color: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-surface);
}

.step-indicator {
  text-align: center;
  font-size: 12px;
  color: var(--color-text);
  white-space: nowrap;
}

.person-group {
  transition: transform 0.3s linear;
}

.foot-path {
  transition: fill 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease, filter 0.15s ease;
}

@media (max-width: 600px) {
  .app-container {
    padding: 6px;
  }
  .simulation-wrapper {
    border-radius: 12px;
  }
  .controls-overlay {
    bottom: 10px;
  }
  .btn-square {
    width: 40px;
    height: 40px;
    font-size: 14px;
  }
  .mode-overlay {
    top: 8px;
    right: 8px;
    padding: 4px 6px;
  }
  .square-mode-btn {
    width: 32px;
    height: 32px;
    font-size: 13px;
  }
  .mode-title {
    font-size: 10px;
  }
}
</style>
</head>
<body>

<div class="app-container">
  <div class="simulation-wrapper">
    <div class="mode-overlay">
      <div class="mode-title">회전 방식</div>
      <div class="mode-buttons-group">
        <button class="square-mode-btn active" id="mode-btn-1" onclick="setMode(1)">1</button>
        <button class="square-mode-btn" id="mode-btn-2" onclick="setMode(2)">2</button>
        <button class="square-mode-btn" id="mode-btn-3" onclick="setMode(3)">3</button>
      </div>
    </div>

    <svg id="sim-canvas"></svg>

    <div class="controls-overlay">
      <div class="step-indicator">
        현재 스텝: <span id="current-step" style="color: var(--color-accent); font-weight: bold;">0</span> / <span id="total-steps">0</span>
      </div>

      <div class="step-controls">
        <button class="btn-square" onclick="resetSim()" title="초기화">↺</button>
        <button class="btn-square btn-primary" onclick="prevStep()" title="이전 스텝">⏮</button>
        <button class="btn-square btn-play" id="play-btn" onclick="togglePlay()" title="재생">▶</button>
        <button class="btn-square btn-primary" onclick="nextStep()" title="다음 스텝">⏭</button>
      </div>
    </div>
  </div>
</div>

<script>
let m = 4; 
let n = 4; 
let currentMode = 1;
let currentStep = 0;
let maxSteps = 25;
let highlightedId = null;

let isPlaying = false;
let playInterval = null;

let people = [];

const svg = document.getElementById('sim-canvas');

class Person {
  constructor(id, r, c, initX, initY) {
    this.id = id;
    this.xIdx = r; 
    this.yIdx = c; 
    
    this.x = initX;
    this.y = initY;
    this.angle = 0;
    this.isMoving = true;
    this.direction = 'NORTH';
    this.isStopped = false;
    
    this.westStepCount = 0;
    this.northStepCount = 0; 
    
    this.stopCountDown = -1; 
    this.westCountDown = -1;

    this.history = [{
      x: this.x,
      y: this.y,
      angle: this.angle,
      isMoving: this.isMoving,
      direction: this.direction,
      isStopped: this.isStopped,
      westStepCount: this.westStepCount,
      northStepCount: this.northStepCount,
      stopCountDown: this.stopCountDown,
      westCountDown: this.westCountDown
    }];
  }

  moveNorth() {
    this.y -= 1; 
    this.angle = 0;
    this.isMoving = true;
    this.isStopped = false;
    this.direction = 'NORTH';
    this.northStepCount += 1; 
    this.westStepCount = 0;   
  }

  moveWest() {
    this.x -= 1; 
    this.angle = -90;
    this.isMoving = true;
    this.isStopped = false;
    this.direction = 'WEST';
    this.westStepCount += 1;   
    this.northStepCount = 0;  
    this.westCountDown = -1;
  }

  stop() {
    this.isMoving = false;
    this.direction = 'STOP';
    this.isStopped = true;
    this.westStepCount = 0;   
    this.northStepCount = 0;  
    this.stopCountDown = -1;  
  }

  recordHistory() {
    this.history.push({
      x: this.x,
      y: this.y,
      angle: this.angle,
      isMoving: this.isMoving,
      direction: this.direction,
      isStopped: this.isStopped,
      westStepCount: this.westStepCount,
      northStepCount: this.northStepCount,
      stopCountDown: this.stopCountDown,
      westCountDown: this.westCountDown
    });
  }
}

function init() {
  buildSimulation();
  window.addEventListener('resize', () => render(false));
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-1').classList.toggle('active', mode === 1);
  document.getElementById('mode-btn-2').classList.toggle('active', mode === 2);
  document.getElementById('mode-btn-3').classList.toggle('active', mode === 3);
  resetSim();
}

function buildSimulation() {
  stopPlay();
  currentStep = 0;

  if (currentMode === 1) {
    runLogicMode1();
  } else if (currentMode === 2) {
    runLogicMode2(); // 🌟 이름 및 알고리즘 개편 연동
  } else if (currentMode === 3) {
    runLogicMode3(); 
  }

  document.getElementById('total-steps').innerText = maxSteps;
  document.getElementById('current-step').innerText = currentStep;

  render(true);
}

function runLogicMode1() {
  people = []; 
  
  for (let r = 1; r <= m; r++) {
    for (let c = 1; c <= n; c++) {
      const id = `${r}-${c}`;
      const initX = c * 2;
      const initY = r * 2;
      people.push(new Person(id, r, c, initX, initY));
    }
  }

  const getPerson = (row, col) => {
    return people.find(p => p.xIdx === row && p.yIdx === col);
  };

  maxSteps = 22;
  
  for (let step = 1; step <= maxSteps; step++) {
    for (let r = 1; r <= m; r++) {
        for (let c = 1; c <= n; c++) {
            const p = getPerson(r, c);
            if (!p) continue;

            if (p.stopCountDown > 0) {
                p.stopCountDown -= 1;
                if (p.stopCountDown === 0) {
                    p.stop(); 
                    continue;
                }
            }

            if (p.westCountDown > 0) {
                p.westCountDown -= 1;
                if(p.westCountDown === 0) {
                    if (c === 4) {
                        p.moveNorth();
                    }
                    p.moveWest();
                    continue;
                }
            }

            const headPerson = getPerson(1, c);
            const leftNeighbor = getPerson(r, c - 1);
            const rightNeighbor = getPerson(r, c + 1);

            const prevHead = headPerson ? headPerson.history[step - 1] : null;
            const prevLeft = leftNeighbor ? leftNeighbor.history[step - 1] : null;
            const prev2Left = (leftNeighbor && step >= 2) ? leftNeighbor.history[step - 2] : null;

            if (step === 1 || step === 2 || step === 3) {
                p.moveNorth();
                continue;
            }

            if (r === 1) {
                if (c === 1 && step === 4) {
                    p.stop();
                    continue;
                }

                if (leftNeighbor && leftNeighbor.isStopped && prevLeft && prevLeft.isMoving) {
                    if (c === n) {
                        p.westCountDown = 1;
                        p.moveNorth();
                    } else {
                        p.stopCountDown = 2;
                        p.moveNorth(); 
                    }
                }
                else if (rightNeighbor && step >= 2 && rightNeighbor.history[step - 2].direction === 'WEST' && rightNeighbor.westStepCount === 2) {
                    p.moveWest(); 
                }
                else {
                    const prevSelf = p.history[step - 1];
                    if (prevSelf) {
                        if (prevSelf.direction === 'NORTH') {
                            p.isStopped = false;
                            p.moveNorth();
                        } else if (prevSelf.direction === 'WEST') {
                            p.isStopped = false;
                            p.moveWest();
                        } else {
                            p.stop();
                        }
                    }
                }
            } else {
                if (getPerson(1, c).isStopped === true) {
                    p.stop();
                } else if (headPerson && prevHead && headPerson.westStepCount >= 1 && prevHead.westStepCount < 1) {
                    p.westCountDown = (r - 1) * 2;
                    p.moveNorth();
                } else {
                    const prevSelf = p.history[step - 1];
                    if (prevSelf) {
                        if (prevSelf.direction === 'NORTH') {
                            p.isStopped = false;
                            p.moveNorth();
                        } else if (prevSelf.direction === 'WEST') {
                            p.isStopped = false;
                            p.moveWest();
                        } else {
                            p.stop();
                        }
                    }
                }
            }
        }
    }

    people.forEach(p => p.recordHistory());
  }
}

/* 🌟 [수정] 2번 알고리즘 개편: 규격을 1번/3번 모드와 완전히 맞추고 순수 전진 로직 적용 */
function runLogicMode2() {
  people = [];
  for (let r = 1; r <= m; r++) {
    for (let c = 1; c <= n; c++) {
      const id = `${r}-${c}`;
      const initX = c * 2;
      const initY = r * 2;
      people.push(new Person(id, r, c, initX, initY));
    }
  }
  maxSteps = 22;
  for (let step = 1; step <= maxSteps; step++) {
    people.forEach(p => {
      p.moveNorth(); // 기본 구조에 맞춘 직진 연산
      p.recordHistory();
    });
  }
}

function runLogicMode3() {
  people = []; 
  for (let r = 1; r <= m; r++) {
    for (let c = 1; c <= n; c++) {
      const id = `${r}-${c}`;
      const initX = c * 2;
      const initY = r * 2;
      people.push(new Person(id, r, c, initX, initY));
    }
  }
  maxSteps = 22;
  for (let step = 1; step <= maxSteps; step++) {
    people.forEach(p => p.recordHistory());
  }
}

function render(isInitialBuild = false) {
  const width = svg.clientWidth;
  const height = svg.clientHeight;

  if (width === 0 || height === 0) return;

  const shortSide = Math.min(width, height);
  const targetSubwayLength = shortSide * 0.45;

  const maxInitialX = n * 2;
  const maxInitialY = m * 2;
  const initialSpan = Math.max(maxInitialX, maxInitialY);
  
  const cellSize = targetSubwayLength / (initialSpan > 0 ? initialSpan : 1);
  const radius = cellSize * 0.45; 

  const originX = (width / 2) - (2 * cellSize);
  const originY = (height / 2) - (1 * cellSize);

  if (isInitialBuild || svg.children.length === 0) {
    svg.innerHTML = '';

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `
      <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="var(--color-text)" flood-opacity="0.8"/>
      </filter>
      <pattern id="grid-pattern" patternUnits="userSpaceOnUse">
        <circle cx="0" cy="0" r="2.5" fill="var(--color-accent)" opacity="0.65"/>
      </pattern>
    `;
    svg.appendChild(defs);

    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bgRect.setAttribute('id', 'sim-bg-grid');
    bgRect.setAttribute('width', '100%');
    bgRect.setAttribute('height', '100%');
    bgRect.setAttribute('fill', 'url(#grid-pattern)');
    svg.appendChild(bgRect);

    const landmarksGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    landmarksGroup.setAttribute('id', 'bg-landmarks');
    svg.appendChild(landmarksGroup);

    people.forEach(p => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', `person-${p.id}`);
      g.setAttribute('class', 'person-group');
      g.style.cursor = 'pointer';
      g.onclick = () => toggleHighlight(p.id);

      const leftFoot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      leftFoot.setAttribute('class', 'foot-path left-foot');

      const rightFoot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      rightFoot.setAttribute('class', 'foot-path right-foot');

      const centerLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      centerLine.setAttribute('class', 'center-line');

      const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      arrow.setAttribute('class', 'arrow-path');

      g.appendChild(leftFoot);
      g.appendChild(rightFoot);
      g.appendChild(centerLine);
      g.appendChild(arrow);
      svg.appendChild(g);
    });
  }

  const gridPattern = svg.querySelector('#grid-pattern');
  if (gridPattern) {
    gridPattern.setAttribute('width', cellSize);
    gridPattern.setAttribute('height', cellSize);
    gridPattern.setAttribute('x', originX);
    gridPattern.setAttribute('y', originY);
  }

  const landmarksGroup = svg.querySelector('#bg-landmarks');
  if (landmarksGroup) {
    landmarksGroup.setAttribute('transform', `translate(${originX}, ${originY})`);
    landmarksGroup.innerHTML = `
      <polygon points="${cellSize * 3},${-cellSize * 6} ${cellSize * 45},${-cellSize * 45} ${cellSize * 62},${cellSize * 35}" 
               fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5" stroke-dasharray="6 6"/>

      <rect x="${-cellSize * 45}" y="${cellSize * 4}" width="${cellSize * 46}" height="${cellSize * 42}" 
            transform="rotate(15, ${-cellSize * 22}, ${cellSize * 25})"
            fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2.5" stroke-dasharray="5 5"/>
    `;
  }

  people.forEach(p => {
    const g = document.getElementById(`person-${p.id}`);
    if (!g) return;

    const state = p.history[currentStep];
    if (!state) return;

    const cx = originX + state.x * cellSize;
    const cy = originY + state.y * cellSize;

    g.setAttribute('transform', `translate(${cx}, ${cy}) rotate(${state.angle})`);

    const isHighlighted = (p.id === highlightedId);
    const leftFoot = g.querySelector('.left-foot');
    const rightFoot = g.querySelector('.right-foot');
    const centerLine = g.querySelector('.center-line');
    const arrow = g.querySelector('.arrow-path');

    leftFoot.setAttribute('d', `M 0 ${-radius} A ${radius} ${radius} 0 0 0 0 ${radius}`);
    rightFoot.setAttribute('d', `M 0 ${-radius} A ${radius} ${radius} 0 0 1 0 ${radius}`);

    centerLine.setAttribute('x1', '0');
    centerLine.setAttribute('y1', -radius);
    centerLine.setAttribute('x2', '0');
    centerLine.setAttribute('y2', radius);
    centerLine.setAttribute('stroke', 'var(--color-bg)');
    centerLine.setAttribute('stroke-width', `${radius * 0.15}`);

    const arrowSize = radius * 0.5;
    arrow.setAttribute('d', `M 0 ${-arrowSize} L ${-arrowSize*0.6} ${arrowSize*0.5} L 0 ${arrowSize*0.15} L ${arrowSize*0.6} ${arrowSize*0.5} Z`);

    let activeFoot = 'none';
    if (currentStep > 0) {
      if (state.isMoving) {
        activeFoot = (currentStep % 2 === 1) ? 'left' : 'right';
      } else {
        if (currentStep % 2 === 1) {
          activeFoot = 'left';
        }
      }
    }

    const baseColor = 'var(--color-accent)';
    const footHighlightColor = 'var(--color-new)';

    leftFoot.setAttribute('fill', activeFoot === 'left' ? footHighlightColor : baseColor);
    rightFoot.setAttribute('fill', activeFoot === 'right' ? footHighlightColor : baseColor);
    arrow.setAttribute('fill', 'var(--color-surface)');

    const borderThickness = Math.max(1, radius * 0.08);

    if (isHighlighted) {
      leftFoot.setAttribute('stroke', 'var(--color-text)');
      leftFoot.setAttribute('stroke-width', `${borderThickness * 3}`);
      leftFoot.setAttribute('filter', 'url(#glow-filter)');
      
      rightFoot.setAttribute('stroke', 'var(--color-text)');
      rightFoot.setAttribute('stroke-width', `${borderThickness * 3}`);
      rightFoot.setAttribute('filter', 'url(#glow-filter)');
    } else {
      leftFoot.setAttribute('stroke', 'var(--color-surface)');
      leftFoot.setAttribute('stroke-width', `${borderThickness}`);
      leftFoot.removeAttribute('filter');
      
      rightFoot.setAttribute('stroke', 'var(--color-surface)');
      rightFoot.setAttribute('stroke-width', `${borderThickness}`);
      rightFoot.removeAttribute('filter');
    }
  });
}

function toggleHighlight(id) {
  highlightedId = (highlightedId === id) ? null : id;
  render(false);
}

function nextStep() {
  if (currentStep < maxSteps) {
    currentStep++;
    updateStep();
  } else {
    stopPlay();
  }
}

function prevStep() {
  stopPlay();
  if (currentStep > 0) {
    currentStep--;
    updateStep();
  }
}

function resetSim() {
  stopPlay();
  buildSimulation();
}

function updateStep() {
  document.getElementById('current-step').innerText = currentStep;
  render(false);
}

function togglePlay() {
  if (isPlaying) {
    stopPlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  if (currentStep >= maxSteps) {
    currentStep = 0;
    updateStep();
  }
  isPlaying = true;
  const playBtn = document.getElementById('play-btn');
  playBtn.innerText = '❚❚'; 
  playBtn.classList.add('playing');

  playInterval = setInterval(() => {
    if (currentStep < maxSteps) {
      nextStep();
    } else {
      stopPlay();
    }
  }, 500);
}

function stopPlay() {
  isPlaying = false;
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
  }
  const playBtn = document.getElementById('play-btn');
  if (playBtn) {
    playBtn.innerText = '▶'; 
    playBtn.classList.remove('playing');
  }
}

window.onload = init;
</script>
</body>
</html>
