<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>행렬 좌회전 시뮬레이터</title>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --accent-color: #38bdf8;
  --accent-active: #0284c7;
  --highlight-color: #f43f5e;
  --text-color: #f8fafc;
  --border-color: #334155;
  --foot-highlight: #facc15;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 🌟 [개편] 하단 panel 영역을 없애고 오직 전체 화면을 꽉 채우는 단일 그리드로 변경 */
.app-container {
  flex: 1;
  height: 100%;
  padding: 10px;
  overflow: hidden;
}

.simulation-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #020617;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  overflow: hidden;
}

/* 우측 상단 모드 선택기 오버레이 */
.mode-overlay {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  display: flex;
  gap: 6px;
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(8px);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
}

.square-mode-btn {
  width: 36px;
  height: 36px;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 15px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.square-mode-btn.active {
  background-color: var(--accent-color);
  color: #0f172a;
}

#sim-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* 🌟 [개편] 메인 화면 아래쪽 영역에 절대 위치(Absolute)로 완전히 겹쳐 올린 하단 컨트롤 오버레이 */
.controls-overlay {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: rgba(15, 23, 42, 0.85); /* 투명하고 어두운 배경 처리 */
  backdrop-filter: blur(8px);
  padding: 8px 16px;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}

.step-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.btn-square {
  width: 44px;
  height: 44px;
  padding: 0;
  background-color: var(--card-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.btn-square:active {
  transform: scale(0.92);
}

.btn-square.btn-primary {
  background-color: var(--accent-color);
  color: #0f172a;
  border: none;
}

.btn-square.btn-play {
  background-color: #10b981;
  color: #ffffff;
  border: none;
}

.btn-square.btn-play.playing {
  background-color: #f59e0b;
}

.step-indicator {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  white-space: nowrap;
}

.person-group {
  transition: transform 0.3s linear;
}

.foot-path {
  transition: fill 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease, filter 0.15s ease;
}

@media (max-width: 600px) {
  .app-container {
    padding: 6px;
  }
  .simulation-wrapper {
    border-radius: 12px;
  }
  .controls-overlay {
    bottom: 10px; /* 모바일 기기 하단 내비바 영역 충돌 완화 */
    padding: 6px 12px;
  }
  .btn-square {
    width: 40px;
    height: 40px;
    font-size: 14px;
  }
  .mode-overlay {
    top: 8px;
    right: 8px;
  }
  .square-mode-btn {
    width: 32px;
    height: 32px;
    font-size: 13px;
  }
}
</style>
</head>
<body>

<div class="app-container">
  <div class="simulation-wrapper">
    <!-- 우측 상단 모드 스위치 -->
    <div class="mode-overlay">
      <button class="square-mode-btn active" id="mode-btn-1" onclick="setMode(1)">1</button>
      <button class="square-mode-btn" id="mode-btn-2" onclick="setMode(2)">2</button>
    </div>

    <svg id="sim-canvas"></svg>

    <!-- 🌟 [개편] 메인 화면 내에 완전 오버레이 처리되어 들어간 하단 대시보드 -->
    <div class="controls-overlay">
      <div class="step-indicator">
        현재 스텝: <span id="current-step" style="color: var(--accent-color); font-weight: bold;">0</span> / <span id="total-steps">0</span>
      </div>

      <div class="step-controls">
        <button class="btn-square" onclick="resetSim()" title="초기화">↺</button>
        <button class="btn-square btn-primary" onclick="prevStep()" title="이전 스텝">⏮</button>
        <button class="btn-square btn-play" id="play-btn" onclick="togglePlay()" title="재생">▶</button>
        <button class="btn-square btn-primary" onclick="nextStep()" title="다음 스텝">⏭</button>
      </div>
    </div>
  </div>
</div>

<script>
let m = 4; 
let n = 4; 
let currentMode = 1;
let currentStep = 0;
let maxSteps = 25;
let highlightedId = null;

let isPlaying = false;
let playInterval = null;

let people = [];

const svg = document.getElementById('sim-canvas');

class Person {
  constructor(id, r, c, initX, initY) {
    this.id = id;
    this.xIdx = r; 
    this.yIdx = c; 
    
    this.x = initX;
    this.y = initY;
    this.angle = 0;
    this.isMoving = true;
    this.direction = 'NORTH';
    this.isStopped = false;
    
    this.westStepCount = 0;
    this.northStepCount = 0; 
    
    this.stopCountDown = -1; 
    this.westCountDown = -1;

    this.history = [{
      x: this.x,
      y: this.y,
      angle: this.angle,
      isMoving: this.isMoving,
      direction: this.direction,
      isStopped: this.isStopped,
      westStepCount: this.westStepCount,
      northStepCount: this.northStepCount,
      stopCountDown: this.stopCountDown,
      westCountDown: this.westCountDown
    }];
  }

  moveNorth() {
    this.y -= 1; 
    this.angle = 0;
    this.isMoving = true;
    this.isStopped = false;
    this.direction = 'NORTH';
    this.northStepCount += 1; 
    this.westStepCount = 0;   
  }

  moveWest() {
    this.x -= 1; 
    this.angle = -90;
    this.isMoving = true;
    this.isStopped = false;
    this.direction = 'WEST';
    this.westStepCount += 1;   
    this.northStepCount = 0;  
    this.westCountDown = -1;
  }

  stop() {
    this.isMoving = false;
    this.direction = 'STOP';
    this.isStopped = true;
    this.westStepCount = 0;   
    this.northStepCount = 0;  
    this.stopCountDown = -1;  
  }

  recordHistory() {
    this.history.push({
      x: this.x,
      y: this.y,
      angle: this.angle,
      isMoving: this.isMoving,
      direction: this.direction,
      isStopped: this.isStopped,
      westStepCount: this.westStepCount,
      northStepCount: this.northStepCount,
      stopCountDown: this.stopCountDown,
      westCountDown: this.westCountDown
    });
  }
}

function init() {
  buildSimulation();
  window.addEventListener('resize', () => render(false));
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-1').classList.toggle('active', mode === 1);
  document.getElementById('mode-btn-2').classList.toggle('active', mode === 2);
  resetSim();
}

function buildSimulation() {
  stopPlay();
  currentStep = 0;

  if (currentMode === 1) {
    runLogicMode1();
  } else {
    runDefaultLogic();
  }

  document.getElementById('total-steps').innerText = maxSteps;
  document.getElementById('current-step').innerText = currentStep;

  render(true);
}

function runLogicMode1() {
  people = []; 
  
  for (let r = 1; r <= m; r++) {
    for (let c = 1; c <= n; c++) {
      const id = `${r}-${c}`;
      const initX = c * 2;
      const initY = r * 2;
      people.push(new Person(id, r, c, initX, initY));
    }
  }

  const getPerson = (row, col) => {
    return people.find(p => p.xIdx === row && p.yIdx === col);
  };

  maxSteps = 22;
  
  for (let step = 1; step <= maxSteps; step++) {
    for (let r = 1; r <= m; r++) {
        for (let c = 1; c <= n; c++) {
            const p = getPerson(r, c);
            if (!p) continue;

            if (p.stopCountDown > 0) {
                p.stopCountDown -= 1;
                if (p.stopCountDown === 0) {
                    p.stop(); 
                    continue;
                }
            }

            if (p.westCountDown > 0) {
                p.westCountDown -= 1;
                if(p.westCountDown === 0) {
                    if (c === 4) {
                        p.moveNorth();
                    }
                    p.moveWest();
                    continue;
                }
            }

            const headPerson = getPerson(1, c);
            const leftNeighbor = getPerson(r, c - 1);
            const rightNeighbor = getPerson(r, c + 1);

            const prevHead = headPerson ? headPerson.history[step - 1] : null;
            const prevLeft = leftNeighbor ? leftNeighbor.history[step - 1] : null;
            const prev2Left = (leftNeighbor && step >= 2) ? leftNeighbor.history[step - 2] : null;

            if (step === 1 || step === 2 || step === 3) {
                p.moveNorth();
                continue;
            }

            if (r === 1) {
                if (c === 1 && step === 4) {
                    p.stop();
                    continue;
                }

                if (leftNeighbor && leftNeighbor.isStopped && prevLeft && prevLeft.isMoving) {
                    if (c === n) {
                        p.westCountDown = 1;
                        p.moveNorth();
                    } else {
                        p.stopCountDown = 2;
                        p.moveNorth(); 
                    }
                }
                else if (rightNeighbor && step >= 2 && rightNeighbor.history[step - 2].direction === 'WEST' && rightNeighbor.westStepCount === 2) {
                    p.moveWest(); 
                }
                else {
                    const prevSelf = p.history[step - 1];
                    if (prevSelf) {
                        if (prevSelf.direction === 'NORTH') {
                            p.isStopped = false;
                            p.moveNorth();
                        } else if (prevSelf.direction === 'WEST') {
                            p.isStopped = false;
                            p.moveWest();
                        } else {
                            p.stop();
                        }
                    }
                }
            } else {
                if (getPerson(1, c).isStopped === true) {
                    p.stop();
                } else if (headPerson && prevHead && headPerson.westStepCount >= 1 && prevHead.westStepCount < 1) {
                    p.westCountDown = (r - 1) * 2;
                    p.moveNorth();
                } else {
                    const prevSelf = p.history[step - 1];
                    if (prevSelf) {
                        if (prevSelf.direction === 'NORTH') {
                            p.isStopped = false;
                            p.moveNorth();
                        } else if (prevSelf.direction === 'WEST') {
                            p.isStopped = false;
                            p.moveWest();
                        } else {
                            p.stop();
                        }
                    }
                }
            }
        }
    }

    people.forEach(p => p.recordHistory());
  }
}

function runDefaultLogic() {
  people = [];
  let id = 0;
  for (let r = 0; r < m; r++) {
    for (let c = 0; c < n; c++) {
      people.push({
        id: `${r}-${c}`,
        xIdx: r + 1,
        yIdx: c + 1,
        history: [{ x: c * 2, y: r * 2, angle: 0, isMoving: true, isStopped: false, direction: 'NORTH' }]
      });
    }
  }
  maxSteps = 15;
  for (let s = 1; s <= maxSteps; s++) {
    people.forEach(p => {
      p.history.push({ x: (p.yIdx - 1) * 2, y: (p.xIdx - 1) * 2 - s, angle: 0, isMoving: true, isStopped: false, direction: 'NORTH' });
    });
  }
}

function render(isInitialBuild = false) {
  const width = svg.clientWidth;
  const height = svg.clientHeight;

  if (width === 0 || height === 0) return;

  const shortSide = Math.min(width, height);
  const targetSubwayLength = shortSide * 0.45;

  const maxInitialX = n * 2;
  const maxInitialY = m * 2;
  const initialSpan = Math.max(maxInitialX, maxInitialY);
  
  const cellSize = targetSubwayLength / (initialSpan > 0 ? initialSpan : 1);
  const radius = Math.max(10, cellSize * 0.45);

  const originX = (width / 2) - (2 * cellSize);
  const originY = (height / 2) - (1 * cellSize);

  if (isInitialBuild || svg.children.length === 0) {
    svg.innerHTML = '';

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `
      <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="var(--highlight-color)" flood-opacity="0.8"/>
      </filter>
    `;
    svg.appendChild(defs);

    people.forEach(p => {
      const state = p.history[currentStep];
      if (!state) return;
      
      const cx = originX + state.x * cellSize;
      const cy = originY + state.y * cellSize;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', `person-${p.id}`);
      g.setAttribute('class', 'person-group');
      g.setAttribute('transform', `translate(${cx}, ${cy}) rotate(${state.angle})`);
      g.style.cursor = 'pointer';
      g.onclick = () => toggleHighlight(p.id);

      const leftFoot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      leftFoot.setAttribute('class', 'foot-path left-foot');
      leftFoot.setAttribute('d', `M 0 ${-radius} A ${radius} ${radius} 0 0 0 0 ${radius} Z`);

      const rightFoot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      rightFoot.setAttribute('class', 'foot-path right-foot');
      rightFoot.setAttribute('d', `M 0 ${-radius} A ${radius} ${radius} 0 0 1 0 ${radius} Z`);

      const centerLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      centerLine.setAttribute('class', 'center-line');
      centerLine.setAttribute('x1', '0');
      centerLine.setAttribute('y1', -radius);
      centerLine.setAttribute('x2', '0');
      centerLine.setAttribute('y2', radius);
      centerLine.setAttribute('stroke', '#020617');
      centerLine.setAttribute('stroke-width', '1.5');

      const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const arrowSize = radius * 0.5;
      arrow.setAttribute('class', 'arrow-path');
      arrow.setAttribute('d', `M 0 ${-arrowSize} L ${-arrowSize*0.6} ${arrowSize*0.5} L 0 ${arrowSize*0.15} L ${arrowSize*0.6} ${arrowSize*0.5} Z`);

      g.appendChild(leftFoot);
      g.appendChild(rightFoot);
      g.appendChild(centerLine);
      g.appendChild(arrow);
      svg.appendChild(g);
    });
  }

  people.forEach(p => {
    const g = document.getElementById(`person-${p.id}`);
    if (!g) return;

    const state = p.history[currentStep];
    if (!state) return;

    const cx = originX + state.x * cellSize;
    const cy = originY + state.y * cellSize;

    g.setAttribute('transform', `translate(${cx}, ${cy}) rotate(${state.angle})`);

    const isHighlighted = (p.id === highlightedId);
    const leftFoot = g.querySelector('.left-foot');
    const rightFoot = g.querySelector('.right-foot');
    const arrow = g.querySelector('.arrow-path');

    let activeFoot = 'none';

    if (currentStep > 0 && state.isMoving) {
      activeFoot = (currentStep % 2 === 1) ? 'left' : 'right';
    }

    const baseColor = 'var(--accent-color)';
    const footHighlightColor = 'var(--foot-highlight)';

    leftFoot.setAttribute('fill', activeFoot === 'left' ? footHighlightColor : baseColor);
    rightFoot.setAttribute('fill', activeFoot === 'right' ? footHighlightColor : baseColor);
    arrow.setAttribute('fill', '#0f172a');

    if (isHighlighted) {
      leftFoot.setAttribute('stroke', 'var(--highlight-color)');
      leftFoot.setAttribute('stroke-width', '3');
      leftFoot.setAttribute('filter', 'url(#glow-filter)');
      
      rightFoot.setAttribute('stroke', 'var(--highlight-color)');
      rightFoot.setAttribute('stroke-width', '3');
      rightFoot.setAttribute('filter', 'url(#glow-filter)');
    } else {
      leftFoot.setAttribute('stroke', 'var(--border-color)');
      leftFoot.setAttribute('stroke-width', '1');
      leftFoot.removeAttribute('filter');
      
      rightFoot.setAttribute('stroke', 'var(--border-color)');
      rightFoot.setAttribute('stroke-width', '1');
      rightFoot.removeAttribute('filter');
    }
  });
}

function toggleHighlight(id) {
  highlightedId = (highlightedId === id) ? null : id;
  render(false);
}

function nextStep() {
  if (currentStep < maxSteps) {
    currentStep++;
    updateStep();
  } else {
    stopPlay();
  }
}

function prevStep() {
  stopPlay();
  if (currentStep > 0) {
    currentStep--;
    updateStep();
  }
}

function resetSim() {
  stopPlay();
  buildSimulation();
}

function updateStep() {
  document.getElementById('current-step').innerText = currentStep;
  render(false);
}

function togglePlay() {
  if (isPlaying) {
    stopPlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  if (currentStep >= maxSteps) {
    currentStep = 0;
    updateStep();
  }
  isPlaying = true;
  const playBtn = document.getElementById('play-btn');
  playBtn.innerText = '❚❚'; 
  playBtn.classList.add('playing');

  playInterval = setInterval(() => {
    if (currentStep < maxSteps) {
      nextStep();
    } else {
      stopPlay();
    }
  }, 500);
}

function stopPlay() {
  isPlaying = false;
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
  }
  const playBtn = document.getElementById('play-btn');
  if (playBtn) {
    playBtn.innerText = '▶'; 
    playBtn.classList.remove('playing');
  }
}

window.onload = init;
</script>
</body>
</html>
